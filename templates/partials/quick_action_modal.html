{# templates/partials/quick_action_modal.html #}
<div class="modal fade" id="quickActionModal" tabindex="-1"
     aria-labelledby="quickActionModalLabel" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered" style="max-width:480px;">
    <div class="modal-content border-0 shadow-lg" style="border-radius:var(--radius);">

      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="quickActionModalLabel">
          <i class="bi bi-lightning-charge text-primary me-2"></i>Quick Actions
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        <div class="row g-3">

          <div class="col-6">
            <a href="{% url 'sales:create' %}"
               class="d-flex flex-column align-items-center gap-2 p-3 rounded-3 border text-decoration-none quick-action-tile"
               style="transition:all .15s;">
              <span class="rounded-circle d-flex align-items-center justify-content-center"
                    style="width:48px;height:48px;background:var(--erp-primary-ultra);">
                <i class="bi bi-cart-plus text-primary" style="font-size:22px;"></i>
              </span>
              <span style="font-size:13px;font-weight:600;color:var(--erp-text-primary);">New Sale</span>
              <small class="text-muted" style="font-size:11px;">Create sales invoice</small>
            </a>
          </div>

          <div class="col-6">
            <a href="{% url 'purchases:create' %}"
               class="d-flex flex-column align-items-center gap-2 p-3 rounded-3 border text-decoration-none quick-action-tile"
               style="transition:all .15s;">
              <span class="rounded-circle d-flex align-items-center justify-content-center"
                    style="width:48px;height:48px;background:#FFF7ED;">
                <i class="bi bi-bag-plus" style="font-size:22px;color:#F97316;"></i>
              </span>
              <span style="font-size:13px;font-weight:600;color:var(--erp-text-primary);">New Purchase</span>
              <small class="text-muted" style="font-size:11px;">Create purchase order</small>
            </a>
          </div>

          <div class="col-6">
            <a href="{% url 'payments:create' %}"
               class="d-flex flex-column align-items-center gap-2 p-3 rounded-3 border text-decoration-none quick-action-tile"
               style="transition:all .15s;">
              <span class="rounded-circle d-flex align-items-center justify-content-center"
                    style="width:48px;height:48px;background:var(--erp-success-bg);">
                <i class="bi bi-cash-coin" style="font-size:22px;color:var(--erp-success);"></i>
              </span>
              <span style="font-size:13px;font-weight:600;color:var(--erp-text-primary);">Receive Payment</span>
              <small class="text-muted" style="font-size:11px;">Record collection</small>
            </a>
          </div>

          <div class="col-6">
            <a href="{% url 'inventory:add_stock' %}"
               class="d-flex flex-column align-items-center gap-2 p-3 rounded-3 border text-decoration-none quick-action-tile"
               style="transition:all .15s;">
              <span class="rounded-circle d-flex align-items-center justify-content-center"
                    style="width:48px;height:48px;background:var(--erp-info-bg);">
                <i class="bi bi-box-seam" style="font-size:22px;color:var(--erp-info);"></i>
              </span>
              <span style="font-size:13px;font-weight:600;color:var(--erp-text-primary);">Add Stock</span>
              <small class="text-muted" style="font-size:11px;">Update inventory</small>
            </a>
          </div>

          <div class="col-6">
            <a href="{% url 'sales:clients' %}?action=new"
               class="d-flex flex-column align-items-center gap-2 p-3 rounded-3 border text-decoration-none quick-action-tile"
               style="transition:all .15s;">
              <span class="rounded-circle d-flex align-items-center justify-content-center"
                    style="width:48px;height:48px;background:#EFF6FF;">
                <i class="bi bi-person-plus-fill" style="font-size:22px;color:#1E5EFF;"></i>
              </span>
              <span style="font-size:13px;font-weight:600;color:var(--erp-text-primary);">Add Client</span>
              <small class="text-muted" style="font-size:11px;">Register customer</small>
            </a>
          </div>

        </div>

        {# Keyboard shortcut hint #}
        <p class="text-center text-muted mt-3 mb-0" style="font-size:11.5px;">
          Press <kbd>N</kbd> for New · <kbd>/</kbd> to search · <kbd>Esc</kbd> to close
        </p>
      </div>
    </div>
  </div>
</div>

<style>
.quick-action-tile:hover {
  border-color: var(--erp-primary) !important;
  background: var(--erp-primary-ultra);
  transform: translateY(-2px);
  box-shadow: var(--erp-shadow);
}
</style>
